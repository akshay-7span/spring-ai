spring.application.name=ai
server.servlet.context-path=/spring-ai
spring.ai.openai.api-key=${SECRET}
spring.ai.openai.chat.options.model=gpt-4.1-nano
spring.ai.retry.max-attempts=1
spring.ai.openai.base-url=https://api.openai.com

# Embedding model (used for ingest + query embeddings)
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1536

# Pinecone vector store (used by Spring AI PineconeVectorStore for Top-K retrieval)
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX}
spring.ai.vectorstore.pinecone.namespace=employee-handbook

# Reranking + retrieval tuning
rerank.model=bge-reranker-v2-m3
search.top-k=5
search.top-n=3
search.source-file=abc_company_employee_handbook.txt